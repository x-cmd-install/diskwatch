A_kwDOSe44Ls4se-9k","name":"diskwatch-linux-x86_64-static.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":1363563,"digest":"sha256:0e092b155c896049667b5fd090f8f24dbf5c814d2b2698b2cb5826da5eda84ba","download_count":6,"created_at":"2026-11-14T04:43:31Z","updated_at":"2026-11-14T04:43:31Z"},{"id":746319722,"node_id":"RA_kwDOSe44Ls4se-9q","name":"diskwatch-linux-x86_64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":1277010,"digest":"sha256:b101c070b7fa3c7842e11245afa9324636bd386c65d33ac3c186fdbd4ddaeaaa","download_count":4,"created_at":"2026-11-14T04:43:31Z","updated_at":"2026-11-14T04:43:31Z"},{"id":746319718,"node_id":"RA_kwDOSe44Ls4se-9m","name":"diskwatch-macos-aarch64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":1000353,"digest":"sha256:c4c1e55b3ffaa26a02f582d9fd7adf180e223138891af9cd4bec9930c11a5f36","download_count":2,"created_at":"2026-11-14T04:43:31Z","updated_at":"2026-11-14T04:43:31Z"},{"id":746319715,"node_id":"RA_kwDOSe44Ls4se-9j","name":"diskwatch-macos-x86_64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":1069752,"digest":"sha256:2dd08293ccaa643f28f3712e304eae7e4b942d625911576a708d8a18d48d466c","download_count":2,"created_at":"2026-11-14T04:43:31Z","updated_at":"2026-11-14T04:43:31Z"},{"id":746319723,"node_id":"RA_kwDOSe44Ls4se-9r","name":"diskwatch-windows-x86_64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":1070699,"digest":"sha256:c4bdc6696281e92be2ce3ce3e2f5a3885bbea3b4387c73e4c562b647c6ec3336","download_count":6,"created_at":"2026-11-14T04:43:31Z","updated_at":"2026-11-14T04:43:31Z"},{"id":746319717,"node_id":"RA_kwDOSe44Ls4se-9l","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":788,"digest":"sha256:3cb340824f9aec027addea15d6c0fca48b23c58587f06e8ec3c16fe876512409","download_count":6,"created_at":"2026-11-14T04:43:31Z","updated_at":"2026-11-14T04:43:31Z"}],"body":"\n### Hot Files\n\n- On Linux, Hot Files no longer takes nearly every inotify watch on the\n  machine. Watching `$HOME` recursively took 523,541 of this host's 547,398\n  and about 0.5 GB, which starves editors and sync tools of watches. It now\n  takes at most a quarter of `fs.inotify.max_user_watches`, and no more than\n  65,536 directories, shallowest first across all roots, keeping an eighth\n  for directories made after startup. The tab says when a root isn't\n  watched all the way down, and `--diag` shows the limit. The same default\n  run now holds 57,344 watches and 38 MB.\n- Opens and reads no longer count as activity, including diskwatch's own.\n  On Linux a quiet tree of 110 directories showed 110 events from\n  diskwatch's own walk, and `ls -R` added 222 more. Both now show none. A\n  write's last event is labelled \"modify\" instead of \"other\".\n- The PROCESS column names a process that holds the file open even when it's\n  doing no IO, dimmed, as the docs describe. It was blank on every row,\n  because processes doing no IO were left out of the lookup.\n- diskwatch no longer lists itself as the busiest process.\n- Directories it can't read inside a root, such as rootless podman storage\n  under `$HOME` or the root-only parts of `/var/log`, show as a note beside\n  the roots, not a red `ERROR:`. Nothing failed: they're skipped.\n- Only the files on screen have their history copied on each frame, not\n  every file tracked. With 4,096 busy files, the most it tracks, that\n  copying took up to 7.5% of a core.\n\n### Terminal\n\n- Stopping diskwatch with SIGTERM, SIGINT, SIGHUP or SIGQUIT, or a crash, no\n  longer leaves your shell in raw mode on the alternate screen, which needed\n  `reset` to fix. If diskwatch is stuck waiting on something, such as a slow\n  `smartctl`, it puts the terminal back and exits a second after the signal.\n- Ctrl-C quits. It did nothing before, because raw mode delivers it as a key.\n- The full view no longer crashes in a small terminal. It crashed below 5\n  rows, or narrower than its header's clock. Below 40×12 it now says the\n  terminal is too small. Lite and Dense draw at any size.\n- Wide characters no longer break rows. Dense drew\n  `日本語のファイル名テスト.log` as `日           log`, and in the Hot tab a CJK\n  or emoji filename pushed the columns after it right, clipping AGE and\n  KIND. Padding and truncation now count terminal columns.\n- Without a terminal, diskwatch says it needs one and points at `--diag`,\n  instead of failing with \"No such device or address (os error 6)\". It exits\n  with status 2.\n\n### SMART and Insights\n\n- SMART polls no longer wake a sleeping hard disk. Every poll, five minutes\n  apart by default, spun up an ATA or SCSI disk that had spun down. smartctl\n  now runs with `-n standby`: a disk in standby is skipped, keeps its last\n  reading, and the SMART tab says \"standby\". Not yet tried on a spinning\n  disk; reports welcome.\n- Insights says \"All systems nominal\" only when SMART was read for every\n  disk. Without root it wasn't, and the card said nominal next to a HEALTH\n  tile reading \"unknown\". It now says no problems were found but SMART\n  wasn't read, and why. Lite's capacity row says \"capacity ok\" instead of\n  \"all nominal\", which is all that row checks.\n- \"Dominating disk IO\" counts physical disks only, and needs at least two.\n  It named zram0, which is swap, and on a one-disk host it named the only\n  disk.\n\n### Static Linux builds\n\n- The static builds no longer grow without limit while files change fast.\n  Under 80,000 writes a second across 20,000 files, 0.7.1 reached 912 MB and\n  was still growing a minute after the writes stopped. The same run now\n  peaks between 37 and 61 MB and falls back to about 20 MB. They use\n  mimalloc now; the glibc, macOS and Windows builds keep their system\n  allocator.\n\n### Homebrew tap users\n\n- Releases no longer update the old `matthart1983/tap` formula, which stays\n  at 0.7.1. diskwatch has been in Homebrew core since 0.5.x. If you\n  installed from the tap, switch with\n  `brew uninstall matthart1983/tap/diskwatch && brew install diskwatch`.\n\n### Docs\n\n- The README says how to run diskwatch under sudo without losing your install\n  or your `$HOME`, and that on macOS and Windows a mount that stops answering\n  can still stall it.\n\n"}
